# Debezium Server Standalone Configuration 
debezium.sink.type=http
debezium.sink.http.url=http://backend:8000/api/cdc
debezium.sink.http.timeout.ms=5000

# PostgreSQL Source Connector Settings
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=sentinel_db
debezium.source.database.server.name=sentinel
debezium.source.topic.prefix=sentinel
debezium.source.schema.include.list=sentinel
debezium.source.plugin.name=pgoutput
debezium.source.tombstones.on.delete=false
debezium.source.decimal.handling.mode=double
debezium.source.tasks.max=1
